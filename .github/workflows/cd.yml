name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 빌드 (JAR 생성)
        run: ./gradlew bootJar -x test

      - name: JAR 및 배포 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 3.94.195.37
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar,Dockerfile,docker-compose.yml"
          target: "/home/ubuntu/app"
          strip_components: 2

      - name: EC2 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.94.195.37
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app

            mv *.jar app.jar 2>/dev/null || true

            cat > .env << 'EOF'
            DB_NAME=ecommerce
            DB_USERNAME=admin
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
            ADMIN_SECRET_KEY=${{ secrets.ADMIN_SECRET_KEY }}
            SOLAPI_API_KEY=${{ secrets.SOLAPI_API_KEY }}
            SOLAPI_SECRET_KEY=${{ secrets.SOLAPI_SECRET_KEY }}
            SOLAPI_FROM=${{ secrets.SOLAPI_FROM }}
            EOF

            docker compose up -d db
            docker compose up -d --build app
