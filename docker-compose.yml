services:
  db:
    image: postgres:16
    container_name: ecommerce-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  app:
    build: .
    container_name: ecommerce
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY}
      SOLAPI_SECRET_KEY: ${SOLAPI_SECRET_KEY}
      SOLAPI_FROM: ${SOLAPI_FROM}
      KAFKA_DB_HOST: ${KAFKA_DB_HOST}
      KAFKA_DB_NAME: ${KAFKA_DB_NAME:-postgres}
      KAFKA_DB_USERNAME: ${KAFKA_DB_USERNAME}
      KAFKA_DB_PASSWORD: ${KAFKA_DB_PASSWORD}
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
