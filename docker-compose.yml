services:
  db:
    image: postgres:16
    container_name: ecommerce-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  app:
    build: .
    container_name: ecommerce
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY}
      SOLAPI_SECRET_KEY: ${SOLAPI_SECRET_KEY}
      SOLAPI_FROM: ${SOLAPI_FROM}
      KAFKA_DB_HOST: ${KAFKA_DB_HOST}
      KAFKA_DB_NAME: ${KAFKA_DB_NAME:-postgres}
      KAFKA_DB_USERNAME: ${KAFKA_DB_USERNAME}
      KAFKA_DB_PASSWORD: ${KAFKA_DB_PASSWORD}
      LOGGING_FILE_NAME: /app/logs/application.log
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE: 500MB
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY: 7
      LOGGING_LOGBACK_ROLLINGPOLICY_TOTAL_SIZE_CAP: 3500MB
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "7"

volumes:
  pgdata:
