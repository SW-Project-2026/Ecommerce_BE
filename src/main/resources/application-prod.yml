spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:ecommerce}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

naver:
  api:
    client-id: ${NAVER_CLIENT_ID:dummy}
    client-secret: ${NAVER_CLIENT_SECRET:dummy}
    shopping-url: https://openapi.naver.com/v1/search/shop.json

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-32-characters-long}
  access-token-expiry: 600000
  refresh-token-expiry: 86400000

cors:
  allowed-origins: http://134.185.111.176

admin:
  secret-key: ${ADMIN_SECRET_KEY:local-admin-secret}

solapi:
  api-key: ${SOLAPI_API_KEY}
  secret-key: ${SOLAPI_SECRET_KEY}
  from: ${SOLAPI_FROM}

swagger:
  server:
    profile: http://134.185.111.176:8080
    name: Production
