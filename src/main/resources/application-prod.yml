spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:ecommerce}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  main:
    lazy-initialization: true

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

server:
  tomcat:
    threads:
      max: 50
      min-spare: 5

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

naver:
  api:
    client-id: ${NAVER_CLIENT_ID:dummy}
    client-secret: ${NAVER_CLIENT_SECRET:dummy}
    shopping-url: https://openapi.naver.com/v1/search/shop.json

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-32-characters-long}
  access-token-expiry: 600000
  refresh-token-expiry: 86400000

app:
  base-url: https://api.daon.site
  frontend-url: https://daon.site

cors:
  allowed-origins: https://daon.site,https://www.daon.site,https://astounding-dango-6fd6b5.netlify.app,https://api.daon.site,http://localhost:5173

admin:
  secret-key: ${ADMIN_SECRET_KEY:local-admin-secret}

solapi:
  api-key: ${SOLAPI_API_KEY}
  secret-key: ${SOLAPI_SECRET_KEY}
  from: ${SOLAPI_FROM}

kafka-db:
  datasource:
    url: jdbc:postgresql://${KAFKA_DB_HOST}:5432/${KAFKA_DB_NAME}
    username: ${KAFKA_DB_USERNAME}
    password: ${KAFKA_DB_PASSWORD}

swagger:
  server:
    profile: https://api.daon.site
    name: Production
